project:
  type: default
  output-dir: salida
  render:
    - observatorio.qmd

format:
  html:
    embed-resources: true
    minimal: true
    theme: none
    css: estilos/observatorio.css
    include-in-header: estilos/cabecera.html
    lang: es
    title-block-style: none
    anchor-sections: false
    html-table-processing: none   # las tablas HTML de R se dejan tal cual (si no, Quarto las reinterpreta)

execute:
  echo: false
  warning: false
  message: false
